<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="十二個項目的五級量表，攻め與受け分別填寫需求和上限，自動標出束縛與落差。">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CP束縛程度量表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Noto+Sans+TC:wght@200;300;400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&text=%E3%82%AB%E3%83%97&display=swap">
<style>
/* Layout: one centered 640px column for everything, generous vertical rhythm. Near-white ground, ink for reading text, champagne gold for structure (rules, numerals, frames), grey only for notes. Apple system fonts first, Noto Sans TC as fallback. Single light look by choice. */
:root{
  --bg:#fcfcfb; --ink:#3d3a36; --sub:#7a756e; --rule:#ebe8e2;
  --gold:#bda274; --gold-t:#9a8256; --gold-pale:#ece6da; --hl:#f2eee5;
  --a:#4f7a96; --b:#b5677a; --a-ink:#fff; --b-ink:#fff;
  --disp:"Gilda Display","Didot",Georgia,serif;
  --serif:"Cormorant Garamond","Garamond",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
:root.custom-a{--a:var(--a-user)} :root.custom-b{--b:var(--b-user)}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.75;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.col{max-width:640px;margin:0 auto}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:1px solid var(--gold-t);outline-offset:3px}
#cap{background:var(--bg)}

/* corner brackets: 「 top-left, 」 bottom-right */
/* trial: 45-degree gold triangles at top-right and bottom-left; buttons and section slashes use the same 45 degrees */
header,footer{position:relative}
.tri{position:absolute;width:min(20vw,210px);height:auto;pointer-events:none}
.tri.tr{top:0;right:0}
.tri.bl{bottom:0;left:0;transform:rotate(180deg)}
.tri pattern line{stroke:var(--gold);stroke-width:1.2}
@media (max-width:600px){.tri{width:40vw}}
/* menu: fixed gold corner tab with a three-line icon that turns into an X */
.menu-btn{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);z-index:30;width:104px;height:104px;border:0;padding:0;background:transparent;cursor:pointer}
.menu-btn::before{content:"";position:absolute;inset:0;background:var(--gold);clip-path:polygon(0 0,100% 0,100% 100%)}
.menu-btn span{position:absolute;top:26px;right:16px;width:28px;height:1.5px;background:#fff;transform-origin:center}
.menu-btn span:nth-child(2){top:34px}
.menu-btn span:nth-child(3){top:42px}
.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0;transform:scaleX(0)}
.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
@media (max-width:760px){.menu-btn{width:84px;height:84px}.menu-btn span{top:20px;right:12px;width:24px}.menu-btn span:nth-child(2){top:27px}.menu-btn span:nth-child(3){top:34px}.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}.head{padding-right:34px;gap:14px}.who{gap:8px}}
.menu-dim{position:fixed;inset:0;z-index:24;background:rgba(61,58,54,.16);opacity:0;visibility:hidden}
.menu-dim.open{opacity:1;visibility:visible}
.menu{position:fixed;top:0;right:0;bottom:0;z-index:25;width:min(360px,86vw);background:var(--bg);border-left:1px solid var(--gold);padding:calc(96px + env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-right,0px)) 32px 32px;display:grid;align-content:start;gap:10px;transform:translateX(100%);visibility:hidden;overflow-y:auto}
.menu.open{transform:none;visibility:visible}
.menu .mlab{font-family:var(--serif);font-weight:500;font-size:.8rem;letter-spacing:.42em;color:var(--gold-t);margin-top:18px}
.menu .mlab:first-child{margin-top:0}
.menu a{display:grid;grid-template-columns:2.4em auto 1fr;align-items:baseline;gap:12px;padding-block:10px;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none}
.menu a .mn{font-weight:200;font-size:1.3rem;color:var(--gold)}
.menu a b{font-family:var(--disp);font-weight:400;letter-spacing:.2em;color:var(--gold-t);font-size:1.05rem}
.menu a small{font-size:.85rem;color:var(--sub);justify-self:end}
.menu a:hover b{color:var(--ink)}
.langs{display:grid;gap:6px}
.langs button{display:flex;justify-content:space-between;align-items:baseline;background:transparent;border:1px solid var(--rule);padding:8px 14px;text-align:left;color:var(--ink)}
.langs button.on{border-color:var(--gold);color:var(--gold-t);font-weight:500}
.langs button:disabled{color:var(--sub);cursor:default}
.langs small{font-size:.75rem}
@media (prefers-reduced-motion:no-preference){
  .menu-btn span{transition:transform .35s ease,opacity .25s ease}
  .menu{transition:transform .4s ease,visibility 0s .4s}
  .menu.open{transition:transform .4s ease}
  .menu-dim{transition:opacity .3s ease,visibility 0s .3s}
  .menu-dim.open{transition:opacity .3s ease}
}


/* header */
header .col{position:relative;padding-block:80px 0;display:grid;gap:18px}
.titles{display:grid;gap:4px;padding-left:18px}
.eyebrow{font-family:var(--serif);font-size:.9rem;font-weight:500;letter-spacing:.42em;color:var(--gold-t)}
h1{margin:0;font-weight:600;font-size:clamp(2.2rem,9vw,4.2rem);line-height:1.2;letter-spacing:.1em;white-space:nowrap;color:var(--ink);text-wrap:balance}
h1 .lat{font-family:var(--disp);font-weight:400;letter-spacing:.06em;margin-right:.08em;color:var(--gold-t)}
.intro{display:grid;gap:18px;padding-block:24px;border-top:1px solid var(--gold);border-bottom:1px solid var(--rule)}
.defs{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:12px 20px;margin:0;align-items:baseline}
.defs dt{font-size:.78rem;font-weight:500;letter-spacing:.1em;color:var(--gold-t);border:1px solid var(--gold);line-height:1.9;text-align:center}
.defs dd{margin:0;font-size:1rem}


/* section heading */
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;padding-bottom:12px;border-bottom:1px solid var(--gold);margin-bottom:28px}
.sh .num{font-weight:200;font-size:2.6rem;line-height:1;color:var(--gold)}
.sh h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(1.4rem,4.2vw,1.9rem);letter-spacing:.24em;line-height:1.2;color:var(--gold-t)}
/* the slash cuts the corner off the number and the word next to it */
.sh .hd{display:inline-flex;align-items:baseline;gap:.12em}
.sh .num{position:relative;z-index:1}
.sh h2{position:relative;z-index:2}
.sh h2::before{content:"";position:absolute;width:1.5em;height:1.5em;left:-.9em;top:50%;transform:translateY(-50%);background:linear-gradient(to bottom right,transparent calc(50% - 4px),var(--bg) calc(50% - 4px),var(--bg) calc(50% - .5px),var(--gold) calc(50% - .5px),var(--gold) calc(50% + .5px),var(--bg) calc(50% + .5px),var(--bg) calc(50% + 4px),transparent calc(50% + 4px))}

main .col{display:grid;gap:48px;padding-block:64px 56px}
main section{min-width:0}

/* toolbar: oversized pale English bleeds past the frame, Chinese sits on top */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.mbtn{position:relative;overflow:hidden;height:54px;background:transparent;border:1px solid var(--gold);padding:0;display:grid;place-items:center;container-type:inline-size}
.mbtn b{position:absolute;left:50%;bottom:-.2em;transform:translateX(-50%);font-family:var(--disp);font-weight:400;font-size:24cqw;line-height:1;letter-spacing:-.01em;color:var(--gold-pale);white-space:nowrap;pointer-events:none}
.mbtn span{position:relative;top:.3em;font-weight:600;font-size:1.02rem;letter-spacing:.2em;padding-left:.2em;color:var(--gold-t)}
.mbtn:hover{background:var(--hl)} .mbtn:hover b{color:#e2d8c4}
@media (max-width:520px){.tools{gap:8px}.mbtn{height:48px}.mbtn span{font-size:.9rem;letter-spacing:.08em;padding-left:.08em}}
.sampleRow{min-height:1.9em;margin-bottom:12px;text-align:center}
.tag{display:inline-block;white-space:nowrap;flex:none;font-size:.72rem;font-weight:600;letter-spacing:.12em;padding:0 10px;line-height:1.9;border:1px solid var(--gold);color:var(--gold-t)}
.tag.fill{background:var(--gold);color:#fff}

/* names */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:16px;border-bottom:1px solid var(--gold);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.who{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:12px;min-width:0}
.who .r{display:grid;line-height:1.3}
.who .r span{font-family:var(--serif);font-size:.85rem;font-weight:500;font-style:italic;letter-spacing:.24em;color:var(--gold-t)}
.who .r b{font-weight:600;font-size:1.55rem;color:var(--c)}
.who input[type="text"]{font:inherit;min-width:0;width:100%;border:0;border-bottom:1px solid var(--gold);background:transparent;color:var(--ink);padding:2px;border-radius:0}
.who input[type="text"]::placeholder{color:var(--sub)}
.who input[type="color"]{width:26px;height:26px;padding:0;border:1px solid var(--gold);background:none;border-radius:0;cursor:pointer}
.who input[type="color"]::-webkit-color-swatch-wrapper{padding:3px}
.who input[type="color"]::-webkit-color-swatch{border:0;border-radius:0}
.who input[type="color"]::-moz-color-swatch{border:0;border-radius:0}
.pa{--c:var(--a);--ci:var(--a-ink);--hatch:var(--a-hatch)} .pb{--c:var(--b);--ci:var(--b-ink);--hatch:var(--b-hatch)}

/* item */
.item{padding-block:36px;border-bottom:1px solid var(--rule);display:grid;gap:20px}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.ttl h3{margin:0;font-weight:600;font-size:1.35rem;letter-spacing:.1em;line-height:1.3}
.ttl .q{font-size:.92rem;color:var(--sub);line-height:1.3}
.anc{display:grid;grid-template-columns:auto minmax(0,4fr) minmax(0,2fr) minmax(0,4fr) auto;column-gap:10px;align-items:start;font-size:.92rem;line-height:1.5}
.anc i{font-style:normal;font-weight:200;font-size:1.6rem;line-height:.9;color:var(--gold-t)}
.anc .lo,.anc .hi{word-break:keep-all;overflow-wrap:break-word}
.anc .lo{grid-column:2}
.anc .hi{grid-column:4;text-align:right}
.anc i.n5{grid-column:5}
@media (max-width:600px){.anc{grid-template-columns:auto minmax(0,4.5fr) minmax(0,1fr) minmax(0,4.5fr) auto;column-gap:6px;font-size:.84rem}}
.roles{display:grid;gap:10px}
.role{display:flex;justify-content:space-between;align-items:center;gap:10px 20px}
.role .rn{font-size:1.05rem;font-weight:600;color:var(--c);width:3em;flex:none}
.line{display:flex;align-items:center;gap:10px}
.line .k{font-size:.85rem;color:var(--sub);letter-spacing:.1em}
.scale{display:flex;gap:7px}
.cell{flex:none;width:40px;height:32px;border:1px solid var(--rule);background:transparent;padding:0;font-size:.88rem;font-weight:500;color:var(--sub);border-radius:0;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--c)}
.cell.on{background:var(--c);border-color:var(--c);color:var(--ci)}
.lim .cell.on{background:var(--hatch);border-color:var(--c);color:var(--ink)}
.lim .cell.end{border:1.5px solid var(--c)}
.flags{display:grid;gap:8px;font-size:.95rem;padding-top:4px}
.flags:empty{display:none}
.flag{display:flex;gap:12px;align-items:baseline}
@media (max-width:600px){
  .role{display:grid;grid-template-columns:3em auto;justify-content:start;gap:8px 12px}
  .role .rn{grid-row:span 2}
}

/* summary */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:48px}
.stat{display:grid;justify-items:center;text-align:center;gap:6px;padding:28px 12px}
.stat+.stat{border-left:1px solid var(--rule)}
.stat .n{font-weight:200;font-size:3.4rem;line-height:1;color:var(--gold-t);font-variant-numeric:tabular-nums}
.stat .l{font-weight:600;letter-spacing:.2em;padding-left:.2em;line-height:1.4}
.stat .d{font-size:.86rem;color:var(--sub);line-height:1.5;max-width:14em}
.key{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;font-size:.9rem;margin-bottom:16px}
.key span{display:inline-flex;gap:8px;align-items:center}
.sq{width:14px;height:14px;display:inline-block;flex:none}
.sq.o{border:1.5px solid var(--sub);background:var(--bg)}
.chart{overflow-x:auto;margin-bottom:56px}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.chart text{font-family:var(--sans)}
.conf{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--gold)}
.conf li{display:grid;grid-template-columns:10rem minmax(0,1fr);gap:6px 20px;padding-block:20px;border-bottom:1px solid var(--rule);align-items:baseline}
.conf li.empty{grid-template-columns:1fr;text-align:center;color:var(--sub)}
.conf .it{font-weight:600;display:flex;gap:12px;align-items:baseline}
.conf .d small{display:block;color:var(--sub);font-size:.88rem}
@media (max-width:520px){.conf li{grid-template-columns:1fr}}

footer .col{position:relative;padding-block:0 104px;display:grid;justify-items:center;gap:12px}
footer .mbtn{width:13rem}
#exportMsg{font-size:.9rem;color:var(--sub);min-height:1.5em}
#preview{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#preview[hidden]{display:none}
#preview .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.9rem}
#preview .bar button{background:transparent;border:1px solid var(--gold);color:var(--gold-t);padding:4px 16px;font-weight:500}
#preview .scroll{overflow:auto;border:1px solid var(--rule);background:var(--bg)}
#preview img{display:block;width:100%;height:auto;max-width:none}

/* fade-in on scroll; only applied by script to elements below the first screen */
@media (prefers-reduced-motion:no-preference){
  .pre{opacity:0;transform:translateY(16px)}
  .fx{transition:opacity .7s ease,transform .7s ease}
  .cell,.mbtn{transition:background .15s,border-color .15s,color .15s}
}

/* per-language system fonts, so kanji and hanzi use the right glyph shapes */
:root:lang(zh-Hans){--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
:root:lang(ja){--sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
:root:lang(ja) h1{font-size:clamp(1.8rem,7.6vw,3.8rem);letter-spacing:.04em}
:root:lang(ja) h1 .lat{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;letter-spacing:.02em;margin-left:-.32em;margin-right:.06em}
:root:lang(en) h1{white-space:normal;font-family:var(--disp);font-weight:400;letter-spacing:.02em;line-height:1.15}
:root:lang(en) h1 .lat{margin-right:0}
:root:lang(en) .ttl h3,:root:lang(en) .stat .l{letter-spacing:.04em}
/* longer Japanese and English button labels and role names on phones */
@media (max-width:600px){
  :root:lang(ja) .mbtn,:root:lang(en) .mbtn{height:58px}
  :root:lang(ja) .tools .mbtn span,:root:lang(en) .tools .mbtn span{top:0;font-size:.74rem;line-height:1.3;letter-spacing:0;padding:0 4px;text-align:center}
  :root:lang(en) .who .r b{font-size:1.15rem}
  :root:lang(en) .who input[type="text"]{font-size:.9rem;letter-spacing:0}
  :root:lang(ja) .tools .mbtn span{word-break:keep-all}
}
/* English and Japanese descriptions run longer: on phones put the 1 and 5 descriptions on their own lines */
@media (min-width:601px){
  :root:lang(en) .anc{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
  :root:lang(en) .anc .lo{grid-column:2;grid-row:1}
  :root:lang(en) .anc .hi{grid-column:2;grid-row:2}
  :root:lang(en) .anc i.n1{grid-column:1;grid-row:1}
  :root:lang(en) .anc i.n5{grid-column:3;grid-row:2}
}
@media (max-width:600px){
  :root:lang(en) .anc,:root:lang(ja) .anc{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
  :root:lang(en) .anc .lo,:root:lang(ja) .anc .lo{grid-column:2;grid-row:1}
  :root:lang(en) .anc .hi,:root:lang(ja) .anc .hi{grid-column:2;grid-row:2}
  :root:lang(en) .anc i.n1,:root:lang(ja) .anc i.n1{grid-column:1;grid-row:1}
  :root:lang(en) .anc i.n5,:root:lang(ja) .anc i.n5{grid-column:3;grid-row:2}
}

/* avatars: one row above the names, squares that open a file picker */
.avatars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-bottom:6px}
.av{position:relative;width:64px;height:64px}
.av-box{position:relative;width:64px;height:64px;padding:5px;border:0;background:transparent;display:grid;place-items:center;color:var(--c);font-size:1.7rem;font-weight:200;line-height:1;cursor:pointer}
.av-box::before,.av-box::after{content:"";position:absolute;width:16px;height:16px;border-color:var(--c);border-style:solid}
.av-box::before{top:0;left:0;border-width:1.5px 0 0 1.5px}
.av-box::after{bottom:0;right:0;border-width:0 1.5px 1.5px 0}
.av-box img{width:100%;height:100%;object-fit:cover;display:block}
.av-x{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border:1px solid var(--gold);background:var(--bg);color:var(--gold-t);font-size:.85rem;line-height:1;padding:0;cursor:pointer}
@media (max-width:760px){.avatars{gap:14px}}
.busy{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;font-size:1rem;color:var(--gold-t)}
.busy[hidden]{display:none}

/* export card: a fixed 1080 x 1350 sheet in the page's own style. Title, the two people facing each
   other across a large ×, then the twelve items in two columns; each item shows 攻め and 受け on two
   stacked lines of diamonds so the pair can be read together. */
#card{position:fixed;top:0;left:0;z-index:50;width:1080px;height:1350px;box-sizing:border-box;padding:60px 72px 52px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden;display:flex;flex-direction:column}
#card .ctri{position:absolute;top:0;right:0;width:200px;height:200px;display:block}
#card .cstrip{display:flex;justify-content:space-between;gap:20px;padding:9px 0 8px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.32em;color:var(--gold-t);margin-right:150px}
#card .ctitle{margin-top:26px;font-weight:600;font-size:66px;line-height:1.15;letter-spacing:.08em;white-space:nowrap}
#card .ctitle .lat{font-family:var(--disp);font-weight:400;color:var(--gold-t);margin-right:.08em}
#card.ja .ctitle .lat{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-weight:500;margin-left:-.16em}
#card.en .ctitle{font-family:var(--disp);font-weight:400;letter-spacing:.02em;font-size:58px}
#card .csub{margin-top:10px;display:flex;align-items:center;gap:14px;font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.3em;color:var(--sub)}
#card .csub b{font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.2em;background:var(--gold);color:#fff;padding:4px 14px}
#card .cpair{margin-top:44px;display:flex;justify-content:center;align-items:center;gap:44px}
#card .cwho{display:flex;align-items:center;gap:26px;min-width:0}
#card .cwho.pb{flex-direction:row-reverse;text-align:right}
#card .cav{position:relative;width:132px;height:156px;flex:none}
#card .cav img,#card .cav .hole{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:cover;display:block}
#card .cav::before,#card .cav::after{content:"";position:absolute;width:30px;height:30px;border-color:var(--c);border-style:solid}
#card .cav::before{top:0;left:0;border-width:2px 0 0 2px}
#card .cav::after{bottom:0;right:0;border-width:0 2px 2px 0}
#card .crole{display:grid;gap:4px;line-height:1.25;min-width:0}
#card .crole i{font-family:var(--serif);font-style:italic;font-weight:500;font-size:17px;letter-spacing:.26em;color:var(--gold-t)}
#card .crole b{font-weight:600;font-size:26px;color:var(--c)}
#card .crole span{font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
#card .crole .blank{display:block;width:200px;height:30px;border-bottom:1px dotted var(--sub)}
#card .cwho.pb .crole .blank{justify-self:end}
#card .cx{display:block;width:120px;height:120px}
#card .csh{margin-top:40px;display:flex;align-items:baseline;gap:16px;padding-bottom:10px;border-bottom:1px solid var(--gold)}
#card .csh h2{margin:0;font-family:var(--disp);font-weight:400;font-size:42px;line-height:1;letter-spacing:.24em;color:var(--gold-t)}
#card .csh .key{margin-left:auto;display:flex;gap:22px;font-size:16px;color:var(--sub);align-self:center}
#card .csh .key span{display:inline-flex;align-items:center;gap:8px}
#card .ccols{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
#card .crow{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;column-gap:18px;height:96px;border-bottom:1px solid var(--rule);padding:0 10px}
#card .crow.bind{background:var(--hl)}
#card .cname{display:grid;justify-items:start;gap:5px;min-width:0}
#card .cname b{font-size:22px;font-weight:600;letter-spacing:.06em;line-height:1.25;word-break:keep-all;overflow-wrap:break-word}
#card.en .cname b{font-size:18px;letter-spacing:.01em}
#card.ja .cname b{font-size:20px;letter-spacing:.02em}
#card .cname span{font-size:13px;font-weight:600;letter-spacing:.14em;padding:1px 9px;border:1px solid var(--gold);color:var(--gold-t);line-height:1.5}
#card .cname span.fill{background:var(--gold);color:#fff}
#card .cmarks{display:grid;gap:12px}
#card .cline{display:flex;align-items:center;gap:10px}
#card .cline i{font-style:normal;font-weight:600;font-size:15px;color:var(--c);width:46px;flex:none;white-space:nowrap}
#card.en .cline i{font-size:14px}
#card .cline svg{display:block}
#card .cfoot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;padding-top:12px;border-top:2px solid var(--ink)}
#card .cstats{display:flex;gap:40px;align-items:baseline}
#card .cstat{display:flex;align-items:baseline;gap:12px}
#card .cstat b{font-weight:200;font-size:52px;line-height:1;color:var(--gold-t)}
#card .cstat span{font-size:18px;font-weight:600;letter-spacing:.14em}
#card .cfoot .mark{font-family:var(--serif);font-weight:500;font-size:15px;letter-spacing:.3em;color:var(--sub)}
</style>

</head>
<body>
<button class="menu-btn" id="menuBtn" type="button" data-i18n-aria="menuOpen" aria-label="打開選單" aria-expanded="false" aria-controls="menuPanel"><span></span><span></span><span></span></button>
<div class="menu-dim" id="menuDim"></div>
<nav class="menu" id="menuPanel" data-i18n-aria="menu" aria-label="選單">
  <p class="mlab">MENU</p>
  <a href="#score"><span class="mn">01</span><b>SCORE</b><small data-i18n="navScore">打分</small></a>
  <a href="#compare"><span class="mn">02</span><b>COMPARE</b><small data-i18n="navCompare">對照</small></a>
  <a href="#export-area"><span class="mn">03</span><b>EXPORT</b><small data-i18n="navExport">匯出為圖片</small></a>
  <p class="mlab">LANGUAGE</p>
  <div class="langs">
    <button type="button" data-lang="zht">繁體中文</button>
    <button type="button" data-lang="zhs">简体中文</button>
    <button type="button" data-lang="ja">日本語</button>
    <button type="button" data-lang="en">English</button>
  </div>
</nav>

<div id="cap">
<header class="gut">
  <svg class="tri tr" viewBox="0 0 100 100" aria-hidden="true"><defs><pattern id="hatTR" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7"/></pattern></defs><polygon points="0,0 100,0 100,100" fill="url(#hatTR)"/></svg>
  <div class="col">
    <div class="titles">
      <div class="eyebrow">SCALE OF BINDING</div>
      <h1><span class="lat" id="titleLat">CP</span><span id="titleRest">束縛程度量表</span></h1>
    </div>
    <div class="intro">
      <p data-i18n="intro">本表共12個項目，每個項目分為「需求」和「上限」兩個指標。</p>
      <dl class="defs">
        <dt data-i18n="need">需求</dt><dd data-i18n="needDef">自身對該項目的需求程度。</dd>
        <dt data-i18n="limit">上限</dt><dd data-i18n="limitDef">對方向自己要求此項時，自己能夠接受的程度。</dd>
      </dl>
      <p data-i18n="hint">點擊格子打分，再點一次取消。</p>
    </div>
  </div>
</header>

<main class="gut">
  <div class="col">
    <section data-i18n-aria="navScore" aria-label="打分" id="score">
      <div class="sh"><span class="hd"><span class="num">01</span><h2>SCORE</h2></span></div>
      <div class="tools" data-html2canvas-ignore>
        <button class="mbtn" id="loadSample" type="button"><b>SAMPLE</b><span data-i18n="btnSample">載入範例</span></button>
        <button class="mbtn" id="clearAll" type="button"><b>CLEAR</b><span data-i18n="btnClear">清空分數</span></button>
        <button class="mbtn" id="resetColor" type="button"><b>COLOR</b><span data-i18n="btnColor">恢復預設色</span></button>
      </div>
      <div class="sampleRow"><span id="sampleBadge" class="tag" data-i18n="sampleBadge" hidden>範例資料</span></div>
      <div class="avatars">
        <div class="av pa"><button type="button" class="av-box" id="avBtnA" data-i18n-aria="avatarA" aria-label="攻め的頭像"><img id="avImgA" alt="" hidden><span>+</span></button><input type="file" id="avFileA" accept="image/*" hidden><button type="button" class="av-x" id="avDelA" data-i18n-aria="avatarDel" aria-label="移除頭像" hidden>×</button></div>
        <div class="av pb"><button type="button" class="av-box" id="avBtnB" data-i18n-aria="avatarB" aria-label="受け的頭像"><img id="avImgB" alt="" hidden><span>+</span></button><input type="file" id="avFileB" accept="image/*" hidden><button type="button" class="av-x" id="avDelB" data-i18n-aria="avatarDel" aria-label="移除頭像" hidden>×</button></div>
      </div>
      <div class="head">
        <div class="who pa">
          <div class="r"><span>SEME</span><b data-role="a">攻め</b></div>
          <input type="text" id="nameA" data-i18n-ph="namePh" placeholder="姓名" data-i18n-aria="nameA" aria-label="攻め的名字">
          <input type="color" id="colorA" data-i18n-aria="colorA" aria-label="攻め的代表色" data-html2canvas-ignore>
        </div>
        <div class="who pb">
          <div class="r"><span>UKE</span><b data-role="b">受け</b></div>
          <input type="text" id="nameB" data-i18n-ph="namePh" placeholder="姓名" data-i18n-aria="nameB" aria-label="受け的名字">
          <input type="color" id="colorB" data-i18n-aria="colorB" aria-label="受け的代表色" data-html2canvas-ignore>
        </div>
      </div>
      <div id="items"></div>
    </section>

    <section data-i18n-aria="navCompare" aria-label="對照" id="compare">
      <div class="sh"><span class="hd"><span class="num">02</span><h2>COMPARE</h2></span></div>
      <div class="stats">
        <div class="stat"><span class="n" id="nBind">0</span><span class="l" data-i18n="tagBind">束縛</span><span class="d" data-i18n="statBind">一方的需求高過另一方的上限</span></div>
        <div class="stat"><span class="n" id="nGap">0</span><span class="l" data-i18n="tagGap">落差</span><span class="d" data-i18n="statGap">沒有超過上限，但兩人的需求相差 2 級以上</span></div>
      </div>
      <div class="key">
        <span><i class="sq" style="background:var(--a)"></i><span id="keyA">攻め</span></span>
        <span><i class="sq" style="background:var(--b)"></i><span id="keyB">受け</span></span>
        <span><i class="sq" style="background:var(--sub)"></i><span data-i18n="need">需求</span></span>
        <span><i class="sq o"></i><span data-i18n="limit">上限</span></span>
        <span><i class="sq" style="background:var(--hl)"></i><span data-i18n="keyBind">其中一方會感到束縛的項目</span></span>
      </div>
      <div class="chart" id="chart"></div>
      <ul class="conf" id="conflicts"></ul>
    </section>
  </div>
</main>
</div>

<footer class="gut" id="export-area">
  <svg class="tri bl" viewBox="0 0 100 100" aria-hidden="true"><defs><pattern id="hatBL" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7"/></pattern></defs><polygon points="0,0 100,0 100,100" fill="url(#hatBL)"/></svg>
  <div class="col">
    <button class="mbtn" id="exportBtn" type="button"><b>EXPORT</b><span data-i18n="navExport">匯出為圖片</span></button>
    <p id="exportMsg" role="status"></p>
  </div>
</footer>

<div class="busy" id="busy" hidden></div>
<div id="preview" hidden role="dialog" data-i18n-aria="previewLabel" aria-label="匯出的圖片">
  <div class="bar"><span data-i18n="previewHint">長按或右鍵點擊圖片即可儲存</span><button type="button" id="closePreview" data-i18n="close">關閉</button></div>
  <div class="scroll"><img id="previewImg" data-i18n-alt="previewLabel" alt="匯出的圖片"></div>
</div>

const IDS=["contact","know","presence","promise","stable","excl","bodyex","social","interv","need","needed","exit"];
const LANG_KEY="bond-sheet-lang";
function pickLang(){
  try{const s=localStorage.getItem(LANG_KEY);if(T[s])return s}catch(e){}
  const n=(navigator.language||"").toLowerCase();
  if(n.startsWith("ja"))return "ja";
  if(n.startsWith("en"))return "en";
  if(/^zh-(cn|sg|hans)/.test(n))return "zhs";
  return "zht";
}
let lang=pickLang();
const L=()=>T[lang];
const wb=t=>t.split("|").join("<wbr>");

const SAMPLE={names:["",""],scores:{
  contact:{a:[5,5],b:[2,3]},know:{a:[4,5],b:[1,2]},presence:{a:[5,5],b:[2,3]},promise:{a:[5,5],b:[1,3]},
  stable:{a:[3,4],b:[4,4]},excl:{a:[5,5],b:[2,5]},bodyex:{a:[5,5],b:[4,5]},social:{a:[3,4],b:[1,2]},
  interv:{a:[3,5],b:[2,2]},need:{a:[5,5],b:[4,4]},needed:{a:[5,5],b:[1,5]},exit:{a:[5,5],b:[2,4]}}};

const KEY="bond-sheet-v3";
let state=blank(), isSample=false, colors={a:"",b:""};
function blank(){const s={names:["",""],scores:{}};IDS.forEach(i=>s.scores[i]={a:[0,0],b:[0,0]});return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,isSample,colors}))}catch(e){}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.state){state=r.state;isSample=!!r.isSample;colors=r.colors||colors}}catch(e){}}
const label=w=>{const n=state.names[w==="a"?0:1];return n?`${L().roles[w]}${L().sep}${n}`:L().roles[w]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const itemName=id=>L().items[id][0].replace(/\|/g,"");

const $=s=>document.querySelector(s);
const nA=$("#nameA"),nB=$("#nameB"),cA=$("#colorA"),cB=$("#colorB");
// 依自訂色的亮度決定格子上的數字用淺色還是深色
function ink(hex){const n=parseInt(hex.slice(1),16),l=(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255;return l>0.6?"#3f3a33":"#fff"}
// 上限格子的斜線底紋用 SVG 圖片，匯出圖片時也能正確畫出來
function hatch(hex){return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><path d='M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2' stroke='${hex}' stroke-opacity='.38' stroke-width='1.4'/></svg>`)}")`}
function applyColors(){
  const root=document.documentElement;
  ["a","b"].forEach(w=>{
    root.classList.toggle("custom-"+w,!!colors[w]);
    if(colors[w]){root.style.setProperty(`--${w}-user`,colors[w]);root.style.setProperty(`--${w}-ink`,ink(colors[w]))}
    else{root.style.removeProperty(`--${w}-user`);root.style.removeProperty(`--${w}-ink`)}
  });
  const cs=getComputedStyle(root),ca=colors.a||cs.getPropertyValue("--a").trim(),cb=colors.b||cs.getPropertyValue("--b").trim();
  root.style.setProperty("--a-hatch",hatch(ca));root.style.setProperty("--b-hatch",hatch(cb));
  cA.value=ca;cB.value=cb;
}

function scaleHTML(id,who,idx){
  let h=`<div class="scale" role="radiogroup" aria-label="${L().roles[who]} ${itemName(id)} ${idx?L().limit:L().need}">`;
  for(let v=1;v<=5;v++)h+=`<button type="button" role="radio" class="cell" aria-checked="false" data-i="${id}" data-w="${who}" data-x="${idx}" data-v="${v}">${v}</button>`;
  return h+"</div>";
}
function roleHTML(id,who){
  return `<div class="role p${who}"><span class="rn">${L().roles[who]}</span>
    <div class="line"><span class="k">${L().need}</span>${scaleHTML(id,who,0)}</div>
    <div class="line lim"><span class="k">${L().limit}</span>${scaleHTML(id,who,1)}</div></div>`;
}
function buildItems(){
  $("#items").innerHTML=IDS.map(id=>{const [name,q,lo,hi]=L().items[id];return `<div class="item reveal" id="it-${id}">
    <div class="ttl"><h3>${wb(name)}</h3><span class="q">${q}</span></div>
    <div class="anc"><i class="n1">1</i><span class="lo">${wb(lo)}</span><span class="hi">${wb(hi)}</span><i class="n5">5</i></div>
    <div class="roles">${roleHTML(id,"a")}${roleHTML(id,"b")}</div>
    <div class="flags" id="fl-${id}"></div></div>`}).join("");
}

// 套用目前語言到頁面上固定的文字
function applyLang(){
  const t=L(),root=document.documentElement;
  root.lang=t.htmlLang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=t[el.dataset.i18n];if(v.includes("|"))el.innerHTML=wb(esc(v));else el.textContent=v});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t[el.dataset.i18nPh]);
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",t[el.dataset.i18nAria]));
  document.querySelectorAll("[data-i18n-alt]").forEach(el=>el.alt=t[el.dataset.i18nAlt]);
  document.querySelectorAll("[data-role]").forEach(el=>el.textContent=t.roles[el.dataset.role]);
  $("#titleLat").textContent=t.lat;$("#titleRest").textContent=t.rest;
  document.title=t.file;
  document.querySelectorAll(".langs button").forEach(b=>{const on=b.dataset.lang===lang;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  const mb=$("#menuBtn");mb.setAttribute("aria-label",mb.getAttribute("aria-expanded")==="true"?t.menuClose:t.menuOpen);
  $("#exportMsg").textContent="";
  buildItems();
}

function analyze(id){
  const s=state.scores[id],A=s.a,B=s.b,out=[],t=L();
  const na=esc(label("a")),nb=esc(label("b"));
  if(A[0]&&B[1]&&A[0]>B[1])out.push({k:"bind",gap:A[0]-B[1],txt:t.bind1(na,nb,A[0]-B[1]),d:t.bind2(nb)});
  if(B[0]&&A[1]&&B[0]>A[1])out.push({k:"bind",gap:B[0]-A[1],txt:t.bind1(nb,na,B[0]-A[1]),d:t.bind2(na)});
  if(!out.length&&A[0]&&B[0]&&Math.abs(A[0]-B[0])>=2){
    const g=Math.abs(A[0]-B[0]),more=A[0]>B[0]?na:nb,less=A[0]>B[0]?nb:na;
    out.push({k:"gap",gap:g,txt:t.gap1(more,less,g),d:t.gap2(more,less)});
  }
  return out;
}
const tag=k=>k==="bind"?L().tagBind:L().tagGap;

function chartSVG(){
  const cs=getComputedStyle(document.documentElement),C=k=>cs.getPropertyValue(k).trim();
  const W=640,rowH=44,top=34,left=lang==="en"?178:(lang==="ja"?150:120),right=20,n=IDS.length,H=top+n*rowH+6;
  const x=v=>left+(v-1)*(W-left-right)/4;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L().chart}">`;
  IDS.forEach((id,i)=>{if(analyze(id).some(f=>f.k==="bind"))g+=`<rect x="0" y="${top+i*rowH}" width="${W}" height="${rowH}" fill="${C("--hl")}"/>`});
  for(let v=1;v<=5;v++)g+=`<line x1="${x(v)}" x2="${x(v)}" y1="${top}" y2="${H-6}" stroke="${C("--rule")}" stroke-width="1"/><text x="${x(v)}" y="${top-14}" text-anchor="middle" font-size="14" font-weight="300" fill="${C("--gold-t")}">${v}</text>`;
  g+=`<line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="${C("--gold")}" stroke-width="1"/>`;
  IDS.forEach((id,i)=>{
    const y=top+i*rowH+rowH/2,s=state.scores[id];
    g+=`<line x1="0" x2="${W}" y1="${y+rowH/2}" y2="${y+rowH/2}" stroke="${C("--rule")}" stroke-width="1"/>`;
    g+=`<text x="4" y="${y+5}" font-size="${lang==="en"?13:14}" fill="${C("--ink")}">${itemName(id)}</text>`;
    [["a",-7,C("--a")],["b",7,C("--b")]].forEach(([w,dy,c])=>{
      const [want,lim]=s[w],yy=y+dy;
      if(want&&lim)g+=`<line x1="${x(want)}" x2="${x(lim)}" y1="${yy}" y2="${yy}" stroke="${c}" stroke-width="1.5"/>`;
      if(lim)g+=`<rect x="${x(lim)-5}" y="${yy-5}" width="10" height="10" fill="${C("--bg")}" stroke="${c}" stroke-width="1.5"/>`;
      if(want)g+=`<rect x="${x(want)-5}" y="${yy-5}" width="10" height="10" fill="${c}"/>`;
    });
  });
  return g+"</svg>";
}

function render(){
  if(document.activeElement!==nA)nA.value=state.names[0];
  if(document.activeElement!==nB)nB.value=state.names[1];
  $("#keyA").textContent=label("a");$("#keyB").textContent=label("b");
  document.querySelectorAll(".cell").forEach(b=>{
    const cur=state.scores[b.dataset.i][b.dataset.w][+b.dataset.x],v=+b.dataset.v;
    b.classList.toggle("on",cur>0&&v<=cur);
    b.classList.toggle("end",cur>0&&v===cur);
    b.setAttribute("aria-checked",v===cur);
  });
  const all=[],cnt={bind:0,gap:0};
  IDS.forEach(id=>{
    const f=analyze(id);
    $("#fl-"+id).innerHTML=f.map(x=>`<span class="flag"><span class="tag${x.k==="bind"?" fill":""}">${tag(x.k)}</span><span>${x.txt}</span></span>`).join("");
    f.forEach(x=>{all.push({...x,item:itemName(id)});cnt[x.k]++});
  });
  $("#nBind").textContent=cnt.bind;$("#nGap").textContent=cnt.gap;
  $("#chart").innerHTML=chartSVG();
  all.sort((p,q)=>(p.k==="bind"?0:1)-(q.k==="bind"?0:1)||q.gap-p.gap);
  $("#conflicts").innerHTML=all.length?all.map(x=>`<li><span class="it"><span class="tag${x.k==="bind"?" fill":""}">${tag(x.k)}</span>${x.item}</span><span class="d">${x.txt}<small>${x.d}</small></span></li>`).join(""):`<li class="empty">${L().empty}</li>`;
  $("#sampleBadge").hidden=!isSample;
}

document.addEventListener("click",e=>{
  const b=e.target.closest(".cell");if(!b)return;
  const arr=state.scores[b.dataset.i][b.dataset.w],x=+b.dataset.x,v=+b.dataset.v;
  arr[x]=arr[x]===v?0:v;isSample=false;save();render();
});
nA.addEventListener("input",()=>{state.names[0]=nA.value;save();render()});
nB.addEventListener("input",()=>{state.names[1]=nB.value;save();render()});
$("#loadSample").addEventListener("click",()=>{state=JSON.parse(JSON.stringify(SAMPLE));isSample=true;save();render()});
$("#clearAll").addEventListener("click",()=>{const n=state.names;state=blank();if(!isSample)state.names=n;isSample=false;save();render()});
cA.addEventListener("input",()=>{colors.a=cA.value;save();applyColors();render()});
cB.addEventListener("input",()=>{colors.b=cB.value;save();applyColors();render()});
$("#resetColor").addEventListener("click",()=>{colors={a:"",b:""};save();applyColors();render()});
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.lang;try{localStorage.setItem(LANG_KEY,lang)}catch(e){}
  applyLang();render();
}));

load();
applyLang();
applyColors();
render();

// 頭像：縮成 240px 的正方形 JPEG 存在瀏覽器裡，清空分數時不會被清掉
const AV_KEY="bond-sheet-avatars";
let avatars={a:"",b:""};
try{const r=JSON.parse(localStorage.getItem(AV_KEY));if(r)avatars={a:r.a||"",b:r.b||""}}catch(e){}
function showAvatars(){
  ["a","b"].forEach(w=>{const U=w.toUpperCase(),img=$("#avImg"+U),box=$("#avBtn"+U),del=$("#avDel"+U),has=!!avatars[w];
    img.hidden=!has;if(has)img.src=avatars[w];else img.removeAttribute("src");
    box.classList.toggle("has",has);box.querySelector("span").hidden=has;del.hidden=!has});
}
function saveAvatars(){try{localStorage.setItem(AV_KEY,JSON.stringify(avatars))}catch(e){}}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const n=240,c=document.createElement("canvas");c.width=c.height=n;const k=Math.min(im.width,im.height),sx=(im.width-k)/2,sy=(im.height-k)/2;
  c.getContext("2d").drawImage(im,sx,sy,k,k,0,0,n,n);res(c.toDataURL("image/jpeg",.86))};im.src=r.result};r.readAsDataURL(file)})}
["a","b"].forEach(w=>{const U=w.toUpperCase(),f=$("#avFile"+U);
  $("#avBtn"+U).addEventListener("click",()=>f.click());
  f.addEventListener("change",async()=>{const file=f.files[0];f.value="";if(!file)return;try{avatars[w]=await shrink(file);saveAvatars();showAvatars()}catch(e){}});
  $("#avDel"+U).addEventListener("click",()=>{avatars[w]="";saveAvatars();showAvatars()});
});
showAvatars();

// 匯出用的圖卡：1080×1350。分數畫成五個菱形：實心是需求，空心延伸到上限，淡色是上限以外
function diamonds(need,lim,color,W){
  const C=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim(),bg=C("--bg");
  const s=10,H=s*2+2,step=(W-2*s-2)/4,cy=1+s,X=v=>1+s+(v-1)*step;
  // 五個菱形用一條細線串起來，菱形本身維持原本的大小
  let g=`<line x1="${X(1)}" y1="${cy}" x2="${X(5)}" y2="${cy}" stroke="${color}" stroke-opacity=".35" stroke-width="1"/>`;
  for(let v=1;v<=5;v++){
    const cx=X(v),pts=`${cx},${cy-s} ${cx+s},${cy} ${cx},${cy+s} ${cx-s},${cy}`;
    if(need&&v<=need){
      // 需求超過自己上限的部分，用斜線表示
      g+=lim&&v>lim?`<polygon points="${pts}" fill="${bg}" stroke="${color}" stroke-width="1.4"/><line x1="${cx-s/2}" y1="${cy+s/2}" x2="${cx+s/2}" y2="${cy-s/2}" stroke="${color}" stroke-width="1.4"/>`
        :`<polygon points="${pts}" fill="${color}"/>`;
    }else if(lim&&v<=lim)g+=`<polygon points="${pts}" fill="${bg}" stroke="${color}" stroke-width="1.4"/>`;
    else g+=`<polygon points="${cx},${cy-3} ${cx+3},${cy} ${cx},${cy+3} ${cx-3},${cy}" fill="${color}" fill-opacity=".45"/>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function buildCard(){
  const t=L(),el=document.createElement("div");el.id="card";el.className=lang;
  const cs=getComputedStyle(document.documentElement),V=k=>cs.getPropertyValue(k).trim(),gold=V("--gold"),ca=V("--a"),cb=V("--b");
  // 斜線三角形畫成 SVG 圖片，匯出時才畫得出來
  let lines="";for(let k=-200;k<200;k+=9)lines+=`<line x1="${k}" y1="0" x2="${k+200}" y2="200"/>`;
  const tri=`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><defs><clipPath id="c"><polygon points="0,0 200,0 200,200"/></clipPath></defs><g clip-path="url(#c)"><g stroke="${gold}" stroke-width="1.3" transform="rotate(90 100 100)">${lines}</g></g></svg>`;
  const who=w=>{const n=esc(state.names[w==="a"?0:1]||"");return `<div class="cwho p${w}"><div class="cav">${avatars[w]?`<img src="${avatars[w]}" alt="">`:`<div class="hole"></div>`}</div>
    <div class="crole"><i>${w==="a"?"SEME":"UKE"}</i><b>${t.roles[w]}</b>${n?`<span>${n}</span>`:`<span class="blank"></span>`}</div></div>`};
  const MW=444-20-150-18;
  const half=ids=>`<div>`+ids.map(id=>{
    const f=analyze(id),s=state.scores[id],k=f.some(x=>x.k==="bind")?"bind":(f.length?"gap":"");
    return `<div class="crow ${k}"><div class="cname"><b>${wb(L().items[id][0])}</b>${k?`<span class="${k==="bind"?"fill":""}">${tag(k)}</span>`:""}</div>
      <div class="cmarks"><div class="cline pa">${diamonds(s.a[0],s.a[1],ca,MW)}</div><div class="cline pb">${diamonds(s.b[0],s.b[1],cb,MW)}</div></div></div>`}).join("")+`</div>`;
  const cnt={bind:0,gap:0};IDS.forEach(id=>analyze(id).forEach(x=>cnt[x.k]++));
  const sub=V("--sub"),d=(f)=>`<svg width="20" height="20"><polygon points="10,1 19,10 10,19 1,10" ${f?`fill="${sub}"`:`fill="none" stroke="${sub}" stroke-width="1.4"`}/></svg>`;
  const keyHl=`<svg width="22" height="16"><rect width="22" height="16" fill="${V("--hl")}"/></svg>`;
  el.innerHTML=`<img class="ctri" alt="" src="data:image/svg+xml,${encodeURIComponent(tri)}">
    <div class="cstrip"><span>SCALE OF BINDING</span><span>12 ITEMS · 5 LEVELS</span></div>
    <div class="ctitle"><span class="lat">${t.lat}</span>${t.rest}</div>
    <div class="csub"><b>${t.roles.a} × ${t.roles.b}</b><span>NEED &amp; LIMIT</span></div>
    <div class="cpair">${who("a")}<svg class="cx" viewBox="0 0 120 120"><line x1="8" y1="8" x2="112" y2="112" stroke="${gold}" stroke-width="1.5"/><line x1="112" y1="8" x2="8" y2="112" stroke="${gold}" stroke-width="1.5"/></svg>${who("b")}</div>
    <div class="csh"><h2>RECORD</h2>
      <div class="key"><span>${d(true)}${t.need}</span><span>${d(false)}${t.limit}</span><span>${keyHl}${t.keyBind}</span></div></div>
    <div class="ccols">${half(IDS.slice(0,6))}${half(IDS.slice(6))}</div>
    <div class="cfoot"><div class="cstats"><div class="cstat"><b>${cnt.bind}</b><span>${t.tagBind}</span></div><div class="cstat"><b>${cnt.gap}</b><span>${t.tagGap}</span></div></div><span class="mark">SCALE OF BINDING</span></div>`;
  return el;
}

// 匯出為圖片：有 downloads 能力時直接存檔，沒有的話（例如在其他 HTML 檢視器打開）改成顯示圖片讓人長按儲存
(()=>{
  const btn=$("#exportBtn"),msg=$("#exportMsg"),pv=$("#preview"),pvImg=$("#previewImg");
  let dlP=null;
  const getDl=()=>dlP||(dlP=(window.claude?.use?window.claude.use("downloads"):Promise.resolve(null)).catch(()=>null));
  getDl();
  $("#closePreview").addEventListener("click",()=>{pv.hidden=true;URL.revokeObjectURL(pvImg.src)});
  function showPreview(blob){
    pvImg.src=URL.createObjectURL(blob);pv.hidden=false;
    msg.textContent="";
  }
  btn.addEventListener("click",async()=>{
    if(!window.html2canvas){msg.textContent=L().netFail;return}
    btn.disabled=true;msg.textContent=L().making;
    const busy=$("#busy");busy.textContent=L().making;busy.hidden=false;
    const card=buildCard();document.body.appendChild(card);
    try{
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      const canvas=await html2canvas(card,{scale:1,width:1080,height:1350,windowWidth:1080,windowHeight:1350,scrollX:0,scrollY:0,x:0,y:0,
        backgroundColor:getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()});
      // 沒有頭像的地方挖成透明，之後可以在修圖軟體裡把圖片墊在下面
      const base=card.getBoundingClientRect(),ctx=canvas.getContext("2d");
      card.querySelectorAll(".cav .hole").forEach(h=>{const r=h.getBoundingClientRect();ctx.clearRect(r.left-base.left+1,r.top-base.top+1,r.width-2,r.height-2)});
      card.remove();busy.hidden=true;
      const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
      const dl=await getDl();
      if(dl){
        try{await dl.save({filename:L().file+".png",data:blob});msg.textContent=L().saved}
        catch(err){
          if(err&&err.code==="declined")msg.textContent=L().canceled;
          else if(err&&err.code==="rate_limited")msg.textContent=L().failed;
          else showPreview(blob);
        }
      }else showPreview(blob);
    }catch(err){
      msg.textContent=L().failed;
    }finally{card.remove();busy.hidden=true;btn.disabled=false}
  });
})();

// 選單：三條線點擊後轉成 X，右側滑出面板
(()=>{
  const btn=$("#menuBtn"),panel=$("#menuPanel"),dim=$("#menuDim");
  const set=o=>{btn.setAttribute("aria-expanded",o);btn.setAttribute("aria-label",o?L().menuClose:L().menuOpen);panel.classList.toggle("open",o);dim.classList.toggle("open",o)};
  btn.addEventListener("click",()=>set(btn.getAttribute("aria-expanded")!=="true"));
  dim.addEventListener("click",()=>set(false));
  panel.querySelectorAll("a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();set(false);const t=document.querySelector(a.getAttribute("href"));if(t)t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}));
  addEventListener("keydown",e=>{if(e.key==="Escape")set(false)});
})();

// 淡入：只對第一個畫面以下的元素生效
if(matchMedia("(prefers-reduced-motion: no-preference)").matches&&"IntersectionObserver" in window){
  const els=[...document.querySelectorAll(".reveal,.sh,.stats,.chart,.conf")];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
  els.forEach(el=>{if(el.getBoundingClientRect().top>innerHeight){el.classList.add("pre","fx");io.observe(el)}});
}
